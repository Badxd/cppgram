# Continuous checks. They run offline only: no Telegram connection, no credentials.
# Triggers: push and pull_request on the default branch, plus manual start. Nothing here publishes or tags.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_DEPS: >-
    cmake ninja-build libboost-dev nlohmann-json3-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libsqlite3-dev
    libgtest-dev ccache

jobs:
  build-gcc:
    name: build + test (GCC, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gcc-x86_64-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt') }}
          restore-keys: ccache-gcc-x86_64-
      - name: Configure (Release, tests on)
        env:
          CC: gcc
          CXX: g++
          CCACHE_DIR: ~/.cache/ccache
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON -DCPPGRAM_USE_CCACHE=ON
      - name: "Build (single job: the largest generated file needs about 3 GB)"
        run: cmake --build build -j1
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-gcc
          path: build/Testing/
          retention-days: 7

  build-clang:
    name: build + test (Clang 18, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS clang-18
      - name: Configure (Release, tests on)
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON -DCPPGRAM_USE_CCACHE=OFF
      - name: Build
        run: cmake --build build -j1
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-clang
          path: build/Testing/
          retention-days: 7

  build-arm64:
    # Runs only when the repository variable ENABLE_ARM64_CI is set to 'true' by the owner. Until a run has
    # happened, ARM64 is NOT VERIFIED.
    name: build + test (GCC, AArch64)
    if: ${{ vars.ENABLE_ARM64_CI == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      - name: Configure (Release, tests on)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON -DCPPGRAM_USE_CCACHE=OFF
      - name: Build
        run: cmake --build build -j1
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-arm64
          path: build/Testing/
          retention-days: 7

  checks:
    name: headers, sources, version, format, schema, examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS clang-format-18
      - name: CMake source lists
        run: python3 tools/check_cmake_sources.py
      - name: Version consistency
        run: bash tools/check_version.sh
      - name: Public API index is current
        run: python3 tools/api_index.py --check
      - name: Format (allowlisted files, clang-format-18)
        run: bash tools/format_check.sh
      - name: Header self-containment
        run: bash tools/check_headers.sh
      - name: Build the TL code generator
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF
          cmake --build build --target cppgram_tl_codegen
      - name: TL schema reproducibility, layer, stale files, checksums
        run: bash tools/check_schema.sh build/cppgram_tl_codegen
      - name: Examples compile (syntax only)
        run: bash tools/check_examples.sh

  sanitizers:
    # Same flags as `make configure-asan`. No debug info: -g makes the api_impl compiles run out of memory.
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=None -DENABLE_TESTS=ON \
            "-DCMAKE_CXX_FLAGS=-O0 -g0 -fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j1
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure --timeout 900
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-asan-ubsan
          path: build-san/Testing/
          retention-days: 7

  thread-sanitizer:
    # Same configuration as tools/run_tsan.sh and `make configure-tsan`. Covers the mtproto test binary.
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      - name: Build and run ThreadSanitizer tests
        run: bash tools/run_tsan.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-logs
          path: build-tsan/
          retention-days: 7

  fuzz-smoke:
    # Compiles the libFuzzer targets with clang-18 and runs each for 60 seconds. Long runs stay manual.
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang-18 libclang-rt-18-dev \
            libboost-dev nlohmann-json3-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libsqlite3-dev
      - name: Build and smoke-run fuzz targets
        run: bash tools/run_fuzz_long.sh 60
      - name: Upload fuzz logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: build-fuzz/logs/
          retention-days: 7
